name: Публикация PWA (Стоимость юруслуг)

on:
  push:
    branches:
      - claude/legal-fee-calculator-expo-ltocf7
      - main
      - master
    paths:
      - 'legal-fee-calculator/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legal-fee-calculator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: legal-fee-calculator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build web (PWA)
        run: npm run build:web

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./legal-fee-calculator/dist
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'Deploy PWA from ${{ github.sha }}'
