name: Деплой калькулятора на Fly.io

on:
  push:
    branches:
      - claude/new-session-pa1hur
    paths:
      - "legal-pricing-app/**"
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-calculator-group
    defaults:
      run:
        working-directory: legal-pricing-app
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
