# Конфигурация развёртывания на Fly.io.
# Имя приложения (app) подставляется при первом деплое (`fly apps create`),
# т.к. должно быть глобально уникальным. См. DEPLOY.md.

app = "legal-pricing-app"    # замените на своё уникальное имя (см. DEPLOY.md)
primary_region = "waw"       # регион можно изменить на ближайший к вам

[build]

[[mounts]]
  source = "legal_pricing_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
